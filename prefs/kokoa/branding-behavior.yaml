# Kokoa —— 首次运行 / 默认浏览器 / 更新检查的行为。
#
# 【★ 2026-09-17 修正：这个文件里原有 4 条【根本不生效】】
#   产物核对（构建 35163254400）发现：prefs 引擎 last wins，而 ffprefs 按【pref 名】
#   稳定排序输出、同名条目保持目录遍历序 —— kokoa/ 排在 privatefox/ 与 zen/ 之前，
#   于是这些同名条目由更靠后的目录胜出：
#
#     pref                                            本文件原值   实际赢家                        影响
#     zen.welcome-screen.seen                         true        zen/welcome.yaml（@cond→false）  ✗ 欢迎页照常出现
#     browser.aboutwelcome.enabled                    false       privatefox/disablemozilla.yaml   ✓ 同值
#     ...activity-stream.asrouter.userprefs.cfr.features false    privatefox/disablemozilla.yaml   ✓ 同值
#     ...activity-stream.asrouter.userprefs.cfr.addons   false    privatefox/disablemozilla.yaml   ✓ 同值
#
#   → 三条同值的已从本文件删除（删了不影响行为，只是不再自欺）；
#     zen.welcome-screen.seen 改到权威位置 prefs/zen/welcome.yaml（那边已改成 true）。
#   → **规则：同一条 pref 只在一个地方定义。** 本目录只放"别处没人定义"的 Kokoa 自有 pref。
#     守卫：scripts/check-pref-shadowing.py（bash scripts/check.sh prefs-shadow）。
#
# 【为什么之前会写成这样】原文的推理是「控制欢迎页的 pref 我们没设 → 那就设上」。
#   推理没错，错在**没有核对产物里最终生效的是哪一条** —— 设了 ≠ 生效。

# ── 默认浏览器提示 ───────────────────────────────────────────
#
# 读它的：AboutWelcomeDefaults.sys.mjs / MessagingTargetingConstants.sys.mjs /
#         OnboardingMessageProvider.sys.mjs（还有 Windows shell 集成）
- name: browser.shell.checkDefaultBrowser
  value: false

# ── ★「推荐消息」总开关（实际定义在 prefs/privatefox/disablemozilla.yaml）─────
#
# 关的是「设为默认 / 固定任务栏」那条 infobar。为什么光有 checkDefaultBrowser=false
# 不够（读 OnboardingMessageProvider 的 INFOBAR_DEFAULT_AND_PIN_87 targeting 得到）：
#   firefoxVersion >= 138 && source == "startup" && !isDefaultBrowser
#   && !checkDefaultBrowser
#   && (现在 - userDisabledDefaultCheck) >= 7 天      <- 每周会再劝一次
#   && profile 创建 >= 5 周 && profile < 15 周
#   && ● asrouter.userprefs.cfr.features ●            <- 就是这个开关
# 这两条现在由 privatefox/disablemozilla.yaml 定义（同值 false），本文件不再重复。

# ── 更新检查（Kokoa 还没有更新服务器）──────────────────
#
# app.update.url.* 指向我们的 GitHub 仓库，那里没有 update.xml，
# 所以「检查更新」必然失败。
#
# 【只设 app.update.auto】
#   证据：about-firefox.mjs 读它；
#   而 app.update.enabled 在产物里【没有任何 JS 读】——
#   原来是凭印象写的，已删（设了没用，属误导）。
- name: app.update.auto
  value: false
